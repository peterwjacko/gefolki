name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - uses: actions/cache@v4
        with:
          path: datasets
          key: datasets-${{ hashFiles('datasets/fetch.py') }}
      - run: python datasets/fetch.py radar_bandep.png optiquehr_georef.png EvalGeFolki S1_Jacksonville_GEE.tif JacksonvilleNavalAirStation_sandiaKu.png
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not gpu" --durations=10
